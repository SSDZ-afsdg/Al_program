<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <!-- 字符编码：使用 UTF-8，保证中文正常显示 -->
    <meta charset="UTF-8" />
    <!-- 视口配置：适配移动端，禁止用户手动缩放造成布局错乱 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 网站描述信息，便于 SEO 搜索引擎收录 -->
    <meta name="description" content="法宝 - AI法律助手，提供AI法律咨询、法律文书生成、合同智能审查等智能法律服务" />
    <!-- 浏览器标签页标题 -->
    <title>法宝 - AI法律助手</title>
  </head>
  <body>
    <!-- Vue 应用的挂载点，main.js 会将应用渲染到该节点 -->
    <div id="app"></div>
    <!-- 以 ES Module 方式加载入口脚本，由 Vite 负责编译打包 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
