# ==========================================================================
# alembic.ini -- Alembic database migration configuration
# NOTE: The real database URL is NOT hardcoded here.
#       alembic/env.py overrides "sqlalchemy.url" from the .env file at
#       runtime, so switching environments only requires changing .env.
# ==========================================================================

[alembic]
# Migration scripts directory
script_location = alembic

# Timezone for migration timestamps (empty = local timezone)
# timezone =

# Placeholder URL; overwritten by env.py with settings.database_url
sqlalchemy.url = mysql+pymysql://root:password@127.0.0.1:3306/fabao?charset=utf8mb4


[post_write_hooks]
# Optional: auto-format generated migrations with black (install black to enable)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
